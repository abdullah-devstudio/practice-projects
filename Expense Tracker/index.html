  <link rel="stylesheet" href="./styles.css"><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <h1 id="logo">Expense Tracker</h1>
    <p id="tagline">Manage your Expense on Mobile</p>
  </header>

  <main>
    <div id="container">
      <div class="container-item" id="current-total">
        <p class="message" id="total-status">Not Total Yet</p>
        <p class="total" id="total-message"></p>
      </div>
    <div class="container-item" id="expense-chart">
      <p id="expense-status" class="message">Not Expense Yet</p>
      <ul id="expense-list"></ul>
    </div>
    </div>

    <div class="cta-btns">
      <a class="btn" href="#expense-form" id="add-expense">Add New Expense</a>
    <a class="btn" href="#expense-chart" id="manage-expense">Manage Expense</a>
    </div>

    <form id="expense-form">
      <label for="title">Title</label>
      <input id="title" type="text" required>
      <br>

      <label for="amount">Amount</label>
      <input id="amount" type="number" required>
      <br>

      <label for="category">Category</label>
      <input id="category" type="text" required>
      <br>

      <label for="date">Date</label>
      <input id="date" type="date" required>
      <br>

      <button class="btn" type="submit">Add Expense</button>
    </form>
    
  </main>
  <footer>
    <p id="footer-txt">Built By Abdullah Dev Studio</p>
  </footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
